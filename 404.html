<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <link rel="icon" type="image/png" href="images/6.png">
    <title>404 – Mattys Lachaise</title>
    <link rel="stylesheet" href="CSS/theme.css">
    <link rel="stylesheet" href="CSS/common.css">
    <link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect" />
    <link as="style" href="https://fonts.googleapis.com/css2?display=swap&family=Space+Grotesk:wght@400;500;700"
        onload="this.rel='stylesheet'" rel="preload" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <style>
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
        }

        .error-card {
            text-align: center;
            padding: 60px 40px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            box-shadow: 0 4px 30px var(--card-shadow);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .error-code {
            font-size: 6rem;
            font-weight: 700;
            color: var(--accent-color);
            line-height: 1;
            margin-bottom: 16px;
            letter-spacing: -4px;
        }

        .error-title {
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 12px;
        }

        .error-desc {
            font-size: 1rem;
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 40px;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 28px;
            background: var(--accent-color);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Space Grotesk', sans-serif;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-home:hover {
            background: var(--btn-primary-hover);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px var(--card-hover-shadow);
        }

        @media (max-width: 480px) {
            .error-code  { font-size: 4.5rem; }
            .error-title { font-size: 1.4rem; }
            .error-card  { padding: 40px 24px; }
        }
    </style>
</head>

<body>
    <main>
        <div class="container">
            <div class="error-card">
                <p class="error-code">404</p>
                <h1 class="error-title">Page introuvable</h1>
                <p class="error-desc">La page que tu cherches n'existe pas ou a été déplacée.</p>
                <a href="index.html" class="btn-home">
                    <span class="material-symbols-outlined">arrow_back</span>
                    Retour à l'accueil
                </a>
            </div>
        </div>
    </main>
    <footer>
        <p>© 2026 Mattys Lachaise. Tous droits réservés.</p>
    </footer>
    <script src="theme.js"></script>
</body>

</html>
